[package]
name = "runner"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
daemonize = "0.5.0"
libc = "0.2.189"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "process", "time", "fs", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
